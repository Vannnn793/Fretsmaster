# Machine ini RAM 16 GB dan sering hampir penuh — jangan minta heap terlalu besar.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
org.gradle.daemon=false
kotlin.incremental=false
android.useAndroidX=true
# AGP 8.x fully supports the legacy DSL used by tflite_flutter's Groovy build.gradle.
# Keep newDsl off so the legacy plugin DSL (compileSdkVersion, kotlin-android) works.
android.newDsl=false
# Pakai built-in Kotlin milik AGP agar target JVM Kotlin == compileOptions modul.
android.builtInKotlin=true
